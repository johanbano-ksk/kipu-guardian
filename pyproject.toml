[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kipu-alert-reviewer"
version = "0.1.0"
description = "Payload-only validation worker for Kipu alerts"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "boto3>=1.43,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "PyYAML>=6.0,<7",
    "structlog>=25.1,<26",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.12,<1",
]
dashboard = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]
slack = [
    "slack-sdk>=3.31.0,<4",
]

[project.scripts]
alert-reviewer-worker = "alert_reviewer.worker:run"
kipu-guardian = "alert_reviewer.guardian_cli:main"
kipu-slack-bot = "alert_reviewer.slack_bot:run"

[tool.hatch.build.targets.wheel]
packages = ["src/alert_reviewer"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["B008"]
